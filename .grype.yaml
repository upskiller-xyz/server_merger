# Exceptions for the grype scan in the image job of ci.yml. Each entry covers
# one package and one CVE, and carries a reason and an expiry date
# (`# expires: YYYY-MM-DD`). The step "Check grype exceptions have not
# expired" fails CI once the date has passed, so an exception cannot linger by
# mistake: fix it, extend it with a new reason, or remove it.
ignore:
  # sqlite-libs 3.54.1-1.hum1 in the Hummingbird base: High, no fixed version
  # published yet. The service does not use sqlite.
  # expires: 2026-12-15
  - vulnerability: CVE-2026-119586
    package:
      name: sqlite-libs
      type: rpm

  # libuuid 2.42.4-2.1.hum1 in the Hummingbird base: High, no fixed version
  # published yet. The service code does not generate UUIDs.
  # expires: 2026-12-15
  - vulnerability: CVE-2026-53615
    package:
      name: libuuid
      type: rpm

  # ffmpeg 8.1.2 bundled in the opencv-python-headless 4.14.0.94 wheel (only
  # for cv2 video I/O). The service never opens video (no VideoCapture/
  # VideoWriter), so libavcodec is not reached. opencv-python-headless 5.x
  # bundles a fixed ffmpeg, but its cv2.warpAffine INTER_NEAREST rounds
  # differently and changes /merge output for rotated windows, so the service
  # stays on opencv 4 until that is resolved. Each entry is scoped to ffmpeg
  # 8.1.2, so a newer wheel drops the match.

  # ffmpeg 8.1.2 High, fixed in ffmpeg 8.1.3, not yet in an opencv 4 wheel.
  # expires: 2026-12-15
  - vulnerability: CVE-2026-107695
    package:
      name: ffmpeg
      version: 8.1.2
      type: binary

